name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AE74B2: ${{ secrets.AE74B2 }}
          B77DEB: ${{ secrets.B77DEB }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AE74B2', ''), os.environ.get('B77DEB', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 7e09082f569eb20e1517e339e0b3d4278cb3 -->', a)
          if b:
              patched = patched.replace('<!-- e216dd31f87183482897e2f8e998 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
