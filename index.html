<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caja Registradora</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#1f4e78"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ac:#1f4e78;--acx:#fff;--bd:#d9dee4;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#6fa8dc;--acx:#10161c;--bd:#33404d;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d242c;--tx:#e8edf2;--mu:#9aa6b2;--ac:#6fa8dc;--acx:#10161c;--bd:#33404d;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
input[type=checkbox]{width:18px;height:18px;padding:0}
button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:bold}
main{padding:14px 16px;max-width:1200px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.step{display:inline-flex;align-items:center;gap:8px}.step b{min-width:24px;text-align:center;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:8px;align-items:center}.ch input{flex:1;min-width:0}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.q{display:inline-flex;align-items:center;gap:4px}.q button,.x{padding:2px 8px}.x{color:var(--bad)}
.lt{min-width:80px;text-align:right}.mu{color:var(--mu);margin:4px 0}small{font-size:11px}
.tt{display:flex;justify-content:space-between}.tt.big{font-size:16px;font-weight:bold}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{background:var(--ac);color:var(--acx)}td.r,th.r{text-align:right}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
#md{z-index:11}
.sheet{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.inv{background:#fff;color:#111;border-radius:8px;padding:16px;border:1px solid #ccc}
.inv h2{margin:0 0 2px;font-size:17px}.inv .mu{color:#555}.inv input,.inv button{color:#111;background:#fff;border-color:#bbb}
.inv th{background:#eee;color:#111}.inv td,.inv th{border-bottom:1px solid #ddd}.inv .pri{background:#1f4e78;color:#fff}
.msg{color:var(--bad);font-size:12px}.set{display:grid;gap:10px;max-width:700px}
button,select,input{touch-action:manipulation}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;min-height:58px}.tile small{color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.chip{white-space:nowrap}
.card.act{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.sb{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;z-index:5}
.sb .pri{margin-left:auto;min-height:44px;padding:0 22px}
main{padding-bottom:84px}
@media(max-width:700px){.card:not(.act){display:none}.card .pri{display:none}input,select,button{font-size:16px;min-height:40px}.q button{min-width:40px}header{padding:8px 12px}h1{font-size:16px}nav button{padding:6px 9px}main{padding:10px}.tiles{grid-template-columns:repeat(2,1fr)}}
@media print{header,main,#md,.no-print{display:none!important}.ov{position:static;background:none;padding:0}.inv{border:0;page-break-after:always}}
</style></head>
<body>
<header><h1>🧾 Caja Registradora</h1><span id="st" class="mu"></span>
<nav><button data-t="caja">Caja</button><button data-t="hist">Historial</button><button data-t="prod">Productos</button><button data-t="desc">Descuentos</button></nav></header>
<main id="app"></main>
<div id="ov" class="ov" hidden></div><div id="md" class="ov" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// Opcional: pega aquí la URL de Apps Script y la clave para que todos los equipos queden conectados sin configurar nada.
const SYNC_URL='',SYNC_KEY='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'RD$ '+(+n||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF=[["P001","Agua 500 ml",25],["P002","Refresco 355 ml",40],["P003","Jugo de naranja",60],["P004","Café",35],["P005","Pan",10],["P006","Galletas",30],["P007","Leche 1 L",75],["P008","Huevos (unidad)",12],["P009","Arroz 1 lb",38],["P010","Habichuelas 1 lb",55]].map((a,i)=>({code:a[0],name:a[1],price:a[2],var:i>=8}));
const C0=store.get('cfg',null)||{};
let cat=C0.cat||store.get('cat',DEF),rate=C0.rate??store.get('rate',18),pin=C0.pin||'',biz=C0.biz||'Mi Negocio';
let discs=C0.discs||[{id:'d1',name:'Cliente frecuente',type:'%',value:10,pin:false},{id:'d2',name:'Descuento gerente',type:'%',value:20,pin:true}];
let sales=store.get('sales',[]);sales.forEach(s=>{s.id=s.id||s.ts+'-'+s.no});
let tab='caja',armed=false,armedH=false,unl=false,pinRes=null,shown=[],q='',act=0,clients=[nc()];
function nc(){return{name:'',pay:'Efectivo',rec:'',disc:'',lines:[]}}
const prod=c=>cat.find(p=>p.code===c)||{code:c,name:c+' (eliminado)',price:0};
const ep=l=>l.price!=null?l.price:prod(l.code).price;
const fno=n=>'F-'+String(n).padStart(4,'0');
const tiles=()=>cat.filter(p=>!q||(p.name+' '+p.code).toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="tile" data-a="tile" data-code="${esc(p.code)}"><b>${esc(p.name)}</b><small>${money(p.price)}</small></button>`).join('')||'<span class="mu">Sin resultados</span>';
const nextNo=()=>sales.reduce((m,s)=>Math.max(m,s.no),0)+1;
function calc(c){const sub=c.lines.reduce((s,l)=>s+ep(l)*l.qty,0),d=discs.find(x=>x.id===c.disc);const ds=d?Math.min(sub,d.type==='%'?sub*d.value/100:d.value):0,base=sub-ds,itbis=base*rate/100;return{sub,ds,dn:d?d.name:'',itbis,total:base+itbis}}
let cfgUpd=C0.upd||0,SYNC=store.get('sync',{url:SYNC_URL,key:SYNC_KEY}),outbox=store.get('outbox',[]),busy=false,lastOk=0;
const cfgObj=()=>({cat,rate,discs,pin,biz,upd:cfgUpd});
const sy=()=>SYNC.url&&SYNC.key;
const dl={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
function queue(m){if(!sy())return;if(m.action==='config')outbox=outbox.filter(x=>x.action!=='config');if(m.action==='clear')outbox=[];outbox.push(m);store.set('outbox',outbox);flush()}
const saveCfg=()=>{cfgUpd=Date.now();store.set('cfg',cfgObj());queue({action:'config',config:cfgObj()})};
async function flush(){if(!sy()||busy||!outbox.length)return;busy=true;setSt();
try{while(outbox.length){const m=outbox[0],r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...m,key:SYNC.key})}),j=await r.json();if(!j.ok)throw 0;
if(m.action==='sale'){const x=sales.find(v=>v.id===m.sale.id);if(x)x.sy=true;store.set('sales',sales)}outbox.shift();store.set('outbox',outbox)}}catch(e){}busy=false;setSt()}
async function pull(){if(!sy()||busy)return;try{const r=await fetch(SYNC.url+(SYNC.url.includes('?')?'&':'?')+'action=pull&key='+encodeURIComponent(SYNC.key)),j=await r.json();if(!j.ok)throw 0;
const rem=j.sales.map(x=>({...x,sy:true})),ids=new Set(rem.map(x=>x.id)),pend=sales.filter(x=>!x.sy&&!ids.has(x.id));
pend.forEach(x=>{if(!outbox.some(m=>m.sale&&m.sale.id===x.id))outbox.push({action:'sale',sale:x})});store.set('outbox',outbox);
sales=rem.concat(pend).sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);store.set('sales',sales);
const o=j.config,pc=outbox.some(m=>m.action==='config');
if(o&&(o.upd||0)>cfgUpd&&!pc){cat=o.cat||cat;rate=o.rate??rate;discs=o.discs||discs;pin=o.pin||'';biz=o.biz||biz;cfgUpd=o.upd;store.set('cfg',cfgObj())}else if(!o&&!pc)queue({action:'config',config:cfgObj()});
lastOk=Date.now();const ae=document.activeElement;if(!((tab==='prod'||tab==='desc')&&ae&&ae.tagName==='INPUT'))render();flush()}catch(e){lastOk=0}setSt()}
async function shareInv(s){if(!s)return;const cv=drawInv(s),b=await new Promise(r=>cv.toBlob(r,'image/png')),f=new File([b],fno(s.no)+'.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Factura '+fno(s.no)});else await dl.save({filename:f.name,data:b})}catch(e){}}
const setSt=()=>{const e=$('#st');if(e)e.textContent=!sy()?'📴 Solo en este dispositivo':outbox.length?`⏳ Pendiente de enviar (${outbox.length})`:lastOk?'✔ Sincronizado':'⚠ Sin conexión con Sheets'};
async function hs(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('caja:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa('caja:'+p)}}
const md=h=>{const m=$('#md');m.hidden=!h;m.innerHTML=h?`<div class="sheet"><div class="inv">${h}</div></div>`:''};
function askPin(){return new Promise(res=>{if(!pin){md('<p>Primero define una clave en la pestaña Productos.</p><button data-a="mdx">Cerrar</button>');pinRes=res;return}
md('<p><b>Clave requerida</b></p><input id="pi" type="password" autocomplete="off"> <p class="msg" id="pm"></p><button class="pri" data-a="pok">Aceptar</button> <button data-a="mdx">Cancelar</button>');pinRes=res;setTimeout(()=>{const i=$('#pi');i&&i.focus()},50)})}
async function pinOk(){if(await hs($('#pi').value)===pin){md('');const r=pinRes;pinRes=null;r&&r(true)}else $('#pm').textContent='Clave incorrecta'}
function card(c,i){const t=calc(c);
return `<section class="card${i===act?' act':''}" data-i="${i}"><div class="ch"><b>Cliente ${i+1}</b><input data-f="name" placeholder="Nombre (opcional)" value="${esc(c.name)}"></div>
<div>${c.lines.length?c.lines.map((l,j)=>{const p=prod(l.code),pr=l.editing?`<input data-f="lp" type="number" min="0" step="0.01" value="${ep(l)}" style="width:90px;padding:3px"> <button data-a="ok" data-j="${j}">✓</button>`:`${money(ep(l))}${l.price!=null?' ✱':''}${p.var?` <button class="x" style="color:inherit;padding:0 5px" data-a="edit" data-j="${j}" title="Cambiar precio (clave)">✎</button>`:''}`;
return `<div class="ln"><span>${esc(p.name)}<br><small class="mu">${pr}</small></span><span class="q"><button data-a="dec" data-j="${j}">−</button><b>${l.qty}</b><button data-a="inc" data-j="${j}">+</button></span><span class="lt">${money(ep(l)*l.qty)}</span><button class="x" data-a="del" data-j="${j}">×</button></div>`}).join(''):'<p class="mu">Sin artículos</p>'}</div>
<select data-f="disc"><option value="">Sin descuento</option>${discs.map(d=>`<option value="${d.id}"${c.disc===d.id?' selected':''}>${esc(d.name)} (${d.type==='%'?d.value+'%':money(d.value)})${d.pin?' 🔒':''}</option>`).join('')}</select>
<div class="tt"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.ds?`<div class="tt"><span>Descuento</span><span>-${money(t.ds)}</span></div>`:''}<div class="tt"><span>ITBIS (${rate}%)</span><span>${money(t.itbis)}</span></div><div class="tt big"><span>Total</span><span>${money(t.total)}</span></div>
<select data-f="pay">${['Efectivo','Tarjeta','Transferencia'].map(m=>`<option${m===c.pay?' selected':''}>${m}</option>`).join('')}</select>
${c.pay==='Efectivo'?`<div class="tt"><input data-f="rec" type="number" min="0" step="0.01" placeholder="Monto recibido" value="${esc(c.rec)}" style="width:150px"><span id="chg${i}">${chg(c)}</span></div>`:''}
<button class="pri" data-a="submit"${t.total?'':' disabled'}>Someter</button></section>`}
function chg(c){const r=parseFloat(c.rec);if(isNaN(r))return'';const d=r-calc(c).total;return d<0?`Falta ${money(-d)}`:`Devuelta ${money(d)}`}

function render(){
act=Math.max(0,Math.min(act,clients.length-1));
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));setSt();const a=$('#app');
if(tab==='caja'){const n=clients.filter(c=>c.lines.length).length;
a.innerHTML=`<div class="bar"><span class="step">Clientes en caja: <button data-a="less">−</button><b>${clients.length}</b><button data-a="more">+</button></span>
<button class="pri" data-a="all"${n?'':' disabled'}>Someter todos (${n})</button><span class="msg">${armed?'Ese cliente tiene artículos. Pulsa − otra vez para quitarlo.':''}</span></div><div class="chips">${clients.map((c,k)=>`<button class="chip${k===act?' on':''}" data-a="chip" data-i="${k}">Cliente ${k+1}${c.lines.length?' ('+c.lines.reduce((u,l)=>u+l.qty,0)+')':''}</button>`).join('')}</div>
<input data-f="q" placeholder="Buscar producto…" value="${esc(q)}" style="width:100%;margin-bottom:8px"><div class="tiles" id="tl">${tiles()}</div>
<div class="grid">${clients.map(card).join('')}</div>
<div class="sb"><span>Cliente ${act+1}: <b>${money(calc(clients[act]).total)}</b></span><button class="pri" data-a="subact"${calc(clients[act]).total?'':' disabled'}>Someter</button></div>`}
else if(tab==='hist'){const tot=sales.reduce((s,x)=>s+x.total,0),by=m=>sales.filter(x=>x.pago===m).reduce((s,x)=>s+x.total,0);
a.innerHTML=`<div class="bar"><b>Facturas: ${sales.length}</b><b>Total: ${money(tot)}</b><span class="mu">Efectivo ${money(by('Efectivo'))} · Tarjeta ${money(by('Tarjeta'))} · Transferencia ${money(by('Transferencia'))}</span></div>
<div class="bar"><button class="pri" data-a="xls"${sales.length&&dl?'':' disabled'}>Descargar Excel</button><button data-a="clr">${armedH?'¿Seguro? Pulsa otra vez para borrar todo':'Vaciar historial'}</button>${dl?'':'<span class="mu">Descarga de Excel no disponible en esta vista.</span>'}</div>
<div class="wrap"><table><tr><th>Factura</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th class="r">Subtotal</th><th class="r">Desc.</th><th class="r">ITBIS</th><th class="r">Total</th><th></th></tr>
${sales.length?sales.slice().reverse().map(s=>`<tr><td>${fno(s.no)}</td><td>${new Date(s.ts).toLocaleString('es-DO')}</td><td>${esc(s.cliente||'Consumidor final')}</td><td>${s.pago}</td><td class="r">${money(s.sub)}</td><td class="r">${money(s.disc||0)}</td><td class="r">${money(s.itbis)}</td><td class="r">${money(s.total)}</td><td><button data-a="view" data-no="${s.no}" data-ts="${s.ts}">Ver</button></td></tr>`).join(''):'<tr><td colspan="9" class="mu">Aún no hay ventas.</td></tr>'}</table></div>`}
else if(tab==='prod'){a.innerHTML=`<div class="set"><label>Nombre del negocio (sale en la factura) <input data-f="biz" value="${esc(biz)}" style="width:100%"></label>
<label>Tasa ITBIS (%) <input data-f="rate" type="number" min="0" step="0.1" value="${rate}" style="width:90px"></label><p class="mu">Supuesto: 18% (tasa general en RD), aplicado después del descuento. Pon 0 si tus precios ya lo incluyen.</p>
<div><b>Clave de caja</b> <span class="mu">${pin?'definida ✓':'sin definir'}</span><br><input id="np" type="password" placeholder="Nueva clave (mín. 4)" autocomplete="off"> <button data-a="setpin">Guardar clave</button> <span class="msg" id="npm"></span>
<p class="mu">Se pide para cambiar precios en caja, aplicar descuentos marcados 🔒, abrir Productos/Descuentos y vaciar el historial. Es un control básico, no seguridad fuerte.</p></div>
<div><b>Respaldo en Google Sheets</b> <span class="mu">${sy()?'configurado':'sin configurar'}</span><br><input data-f="surl" placeholder="URL de la app web (Apps Script)" value="${esc(SYNC.url)}" style="width:100%"><input data-f="skey" type="password" placeholder="Clave" value="${esc(SYNC.key)}" style="width:100%;margin-top:6px"><p class="mu">Se guarda en este dispositivo. Pégala una vez en cada equipo (o déjala fija en el archivo).</p></div>
<div class="wrap"><table><tr><th>Código</th><th>Producto</th><th>Precio (RD$)</th><th>Precio variable</th><th></th></tr>${cat.map((p,k)=>`<tr><td><input data-f="pc" data-k="${k}" value="${esc(p.code)}" style="width:80px"></td><td><input data-f="pn" data-k="${k}" value="${esc(p.name)}"></td><td><input data-f="pp" data-k="${k}" type="number" min="0" step="0.01" value="${p.price}" style="width:100px"></td><td><input data-f="pv" data-k="${k}" type="checkbox"${p.var?' checked':''}></td><td><button class="x" data-a="pdel" data-k="${k}">×</button></td></tr>`).join('')}</table></div>
<p class="mu">Precio variable: en Caja ese producto muestra ✎ para cambiar su precio con la clave.</p><button data-a="padd" style="justify-self:start">+ Agregar producto</button></div>`}
else{a.innerHTML=`<div class="set"><p class="mu">Crea descuentos y aplícalos en Caja desde cada cliente. "Pedir clave" exige la clave para aplicarlo.</p><div class="wrap"><table><tr><th>Nombre</th><th>Tipo</th><th>Valor</th><th>Pedir clave</th><th></th></tr>${discs.map((d,k)=>`<tr><td><input data-f="dn" data-k="${k}" value="${esc(d.name)}"></td><td><select data-f="dt" data-k="${k}"><option value="%"${d.type==='%'?' selected':''}>%</option><option value="$"${d.type==='$'?' selected':''}>RD$</option></select></td><td><input data-f="dv" data-k="${k}" type="number" min="0" step="0.01" value="${d.value}" style="width:90px"></td><td><input data-f="dp" data-k="${k}" type="checkbox"${d.pin?' checked':''}></td><td><button class="x" data-a="ddel" data-k="${k}">×</button></td></tr>`).join('')}</table></div><button data-a="dadd" style="justify-self:start">+ Agregar descuento</button></div>`}}

function build(c){const t=calc(c);const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:nextNo(),ts:new Date().toISOString(),biz,cliente:c.name.trim(),pago:c.pay,rec:c.pay==='Efectivo'&&c.rec!==''?+c.rec:null,rate,items:c.lines.map(l=>({code:l.code,name:prod(l.code).name,price:ep(l),qty:l.qty})),sub:t.sub,disc:t.ds,dn:t.dn,itbis:t.itbis,total:t.total};sales.push(s);store.set('sales',sales);queue({action:'sale',sale:s});return s}
function inv(s){return `<div class="inv"><h2>${esc(s.biz||biz)}</h2><p class="mu">Factura ${fno(s.no)} · ${new Date(s.ts).toLocaleString('es-DO')}</p><p>Cliente: <b>${esc(s.cliente||'Consumidor final')}</b></p>
<table><tr><th>Artículo</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Importe</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${(+i.price).toFixed(2)}</td><td class="r">${(i.price*i.qty).toFixed(2)}</td></tr>`).join('')}</table>
<div class="tt"><span>Subtotal</span><span>${money(s.sub)}</span></div>${s.disc>0?`<div class="tt"><span>Descuento ${esc(s.dn||'')}</span><span>-${money(s.disc)}</span></div>`:''}<div class="tt"><span>ITBIS (${s.rate}%)</span><span>${money(s.itbis)}</span></div><div class="tt big"><span>Total</span><span>${money(s.total)}</span></div>
<div class="tt"><span>Pago</span><span>${s.pago}</span></div>${s.rec!=null?`<div class="tt"><span>Recibido</span><span>${money(s.rec)}</span></div><div class="tt"><span>Devuelta</span><span>${money(Math.max(0,s.rec-s.total))}</span></div>`:''}
<p class="mu" style="text-align:center">¡Gracias por su compra!</p><div class="bar no-print" style="justify-content:center;margin:0"><button data-a="img" data-k="${shown.indexOf(s)}">Guardar imagen</button><button data-a="pdf" data-k="${shown.indexOf(s)}">Guardar PDF</button>${navigator.share?`<button data-a="shr" data-k="${shown.indexOf(s)}">Compartir</button>`:''}</div></div>`}
function showInv(list){shown=list;const o=$('#ov');o.hidden=false;o.innerHTML=`<div class="sheet">${list.map(inv).join('')}<div class="bar no-print" style="justify-content:center"><button class="pri" data-a="print">Imprimir</button><button data-a="close">Cerrar</button></div></div>`;o.scrollTop=0}
function drawInv(s){const W=600,S=2,P=28,R=26;
const tot=[['Subtotal',money(s.sub)]];if(s.disc>0)tot.push(['Descuento'+(s.dn?' ('+s.dn+')':''),'-'+money(s.disc)]);tot.push(['ITBIS ('+s.rate+'%)',money(s.itbis)],['TOTAL',money(s.total),1],['Pago',s.pago]);if(s.rec!=null)tot.push(['Recibido',money(s.rec)],['Devuelta',money(Math.max(0,s.rec-s.total))]);
const H=P+185+s.items.length*R+tot.length*R+60,cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;const x=cv.getContext('2d');x.scale(S,S);x.fillStyle='#fff';x.fillRect(0,0,W,H);
const T=(t,px,py,o={})=>{x.font=(o.b?'bold ':'')+(o.s||15)+'px Arial';x.textAlign=o.a||'left';x.fillStyle=o.c||'#111';x.fillText(t,px,py)},L=y=>{x.strokeStyle='#ccc';x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke()};
const fit=(t,w)=>{x.font='15px Arial';let u=t;while(x.measureText(u).width>w&&u.length>1)u=u.slice(0,-1);return u===t?t:u+'…'};
let y=P+22;T(s.biz||biz,W/2,y,{b:1,s:22,a:'center'});y+=32;T('Factura '+fno(s.no),P,y,{b:1,s:17});T(new Date(s.ts).toLocaleString('es-DO'),W-P,y,{a:'right',c:'#555',s:13});y+=24;
T('Cliente: '+(s.cliente||'Consumidor final'),P,y);y+=14;L(y);y+=22;
T('Artículo',P,y,{b:1,s:13});T('Cant.',350,y,{b:1,s:13,a:'right'});T('Precio',450,y,{b:1,s:13,a:'right'});T('Importe',W-P,y,{b:1,s:13,a:'right'});y+=8;L(y);y+=R-6;
s.items.forEach(i=>{T(fit(i.name,290),P,y);T(String(i.qty),350,y,{a:'right'});T((+i.price).toFixed(2),450,y,{a:'right'});T((i.price*i.qty).toFixed(2),W-P,y,{a:'right'});y+=R});
L(y-8);y+=14;tot.forEach(r=>{T(r[0],300,y,{b:r[2],s:r[2]?18:15});T(r[1],W-P,y,{b:r[2],s:r[2]?18:15,a:'right'});y+=R});
y+=22;T('¡Gracias por su compra!',W/2,y,{a:'center',c:'#555',s:14});return cv}
async function saveInv(s,k){if(!s)return;const cv=drawInv(s);
if(!dl||(k==='pdf'&&!window.jspdf)){md(`<img src="${cv.toDataURL('image/png')}" style="width:100%"><p class="mu">Mantén pulsada la imagen para guardarla o compartirla.</p><button data-a="mdx">Cerrar</button>`);return}
try{if(k==='img')await dl.save({filename:fno(s.no)+'.png',data:await new Promise(r=>cv.toBlob(r,'image/png'))});
else{const w=cv.width/2,h=cv.height/2,p=new window.jspdf.jsPDF({unit:'pt',format:[w,h]});p.addImage(cv.toDataURL('image/png'),'PNG',0,0,w,h);await dl.save({filename:fno(s.no)+'.pdf',data:p.output('arraybuffer')})}}catch(e){}}
function submit(idx){const arr=idx.map(i=>build(clients[i]));clients=clients.filter((_,i)=>!idx.includes(i));if(!clients.length)clients=[nc()];render();showInv(arr)}

async function exportXls(){const f=d=>new Date(d).toLocaleDateString('es-DO'),h=d=>new Date(d).toLocaleTimeString('es-DO'),v=[],fa=[];
sales.forEach(s=>{const k=s.sub?(s.sub-(s.disc||0))/s.sub:1;s.items.forEach(i=>{const sb=i.price*i.qty;v.push({Fecha:f(s.ts),Hora:h(s.ts),Factura:fno(s.no),Cliente:s.cliente||'Consumidor final',Código:i.code,Producto:i.name,Cantidad:i.qty,'Precio unit. (RD$)':i.price,'Subtotal (RD$)':sb,'Descuento (RD$)':sb*(1-k),'ITBIS (RD$)':sb*k*s.rate/100,'Total (RD$)':sb*k*(1+s.rate/100),'Método de pago':s.pago})});
fa.push({Factura:fno(s.no),Fecha:f(s.ts),Hora:h(s.ts),Cliente:s.cliente||'Consumidor final','Subtotal (RD$)':s.sub,Descuento:s.dn||'','Descuento (RD$)':s.disc||0,'ITBIS (RD$)':s.itbis,'Total (RD$)':s.total,'Método de pago':s.pago,'Recibido (RD$)':s.rec==null?'':s.rec,'Devuelta (RD$)':s.rec==null?'':Math.max(0,s.rec-s.total)})});
const wb=XLSX.utils.book_new(),w1=XLSX.utils.json_to_sheet(v),w2=XLSX.utils.json_to_sheet(fa);w1['!cols']=[12,10,10,20,9,22,9,16,14,14,12,12,16].map(w=>({wch:w}));w2['!cols']=[10,12,10,20,14,18,14,12,12,16,14,14].map(w=>({wch:w}));
XLSX.utils.book_append_sheet(wb,w1,'Ventas');XLSX.utils.book_append_sheet(wb,w2,'Facturas');
try{await dl.save({filename:'Ventas_Caja.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})})}catch(e){}}

document.addEventListener('click',async e=>{
const t=e.target.closest('[data-t]');if(t){const n=t.dataset.t;if((n==='prod'||n==='desc')&&pin&&!unl){if(!await askPin())return;unl=true}tab=n;armed=armedH=false;render();return}
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,cd=b.closest('.card'),i=cd?+cd.dataset.i:0,j=+b.dataset.j,k=+b.dataset.k,c=clients[i];if(cd)act=i;
if(a==='pok'){pinOk();return}
if(a==='mdx'){md('');const r=pinRes;pinRes=null;r&&r(false);return}
if(a==='tile'){const cl=clients[act],l=cl.lines.find(x=>x.code===b.dataset.code&&x.price==null);l?l.qty++:cl.lines.push({code:b.dataset.code,qty:1})}
else if(a==='chip')act=+b.dataset.i;
else if(a==='subact'){submit([act]);return}
else if(a==='more'){clients.push(nc());armed=false;act=clients.length-1}
else if(a==='less'){const l=clients[clients.length-1];if(clients.length>1){if(l.lines.length&&!armed)armed=true;else{clients.pop();armed=false}}}
else if(a==='inc')c.lines[j].qty++;
else if(a==='dec'){if(c.lines[j].qty>1)c.lines[j].qty--;else c.lines.splice(j,1)}
else if(a==='del')c.lines.splice(j,1);
else if(a==='edit'){if(await askPin())c.lines[j].editing=true}
else if(a==='ok'){const v=parseFloat(b.closest('.ln').querySelector('input').value);if(!isNaN(v)&&v>=0)c.lines[j].price=v;c.lines[j].editing=false}
else if(a==='submit'){submit([i]);return}
else if(a==='all'){submit(clients.map((c,q)=>c.lines.length?q:-1).filter(q=>q>=0));return}
else if(a==='view'){showInv([sales.find(x=>x.no===+b.dataset.no&&x.ts===b.dataset.ts)]);return}
else if(a==='close'){$('#ov').hidden=true;return}
else if(a==='print'){try{window.print()}catch(x){}return}
else if(a==='shr'){shareInv(shown[k]);return}
else if(a==='img'||a==='pdf'){saveInv(shown[k],a);return}
else if(a==='xls'){exportXls();return}
else if(a==='clr'){if(!armedH)armedH=true;else if(!pin||await askPin()){sales=[];store.set('sales',[]);queue({action:'clear'});armedH=false}}
else if(a==='padd'){cat.push({code:'P'+String(cat.length+1).padStart(3,'0'),name:'Nuevo producto',price:0,var:false});saveCfg()}
else if(a==='pdel'){cat.splice(k,1);saveCfg()}
else if(a==='dadd'){discs.push({id:'d'+Date.now(),name:'Nuevo descuento',type:'%',value:5,pin:false});saveCfg()}
else if(a==='ddel'){discs.splice(k,1);saveCfg()}
else if(a==='setpin'){const v=$('#np').value;if(v.length<4){$('#npm').textContent='Mínimo 4 caracteres';return}pin=await hs(v);unl=true;saveCfg()}
render()});
document.addEventListener('change',async e=>{const f=e.target.dataset.f,card=e.target.closest('.card'),k=+e.target.dataset.k,v=e.target.value,c=card&&clients[+card.dataset.i];
if(f==='add'&&card){if(v){const l=c.lines.find(x=>x.code===v&&x.price==null);l?l.qty++:c.lines.push({code:v,qty:1})}render()}
else if(f==='pay'){c.pay=v;render()}
else if(f==='disc'){const d=discs.find(x=>x.id===v);if(d&&d.pin&&!await askPin()){render();return}c.disc=v;render()}
else if(f==='surl'||f==='skey'){SYNC[f==='surl'?'url':'key']=v.trim();store.set('sync',SYNC);flush();pull();setSt()}
else if(f==='rate'){rate=Math.max(0,+v||0);saveCfg()}else if(f==='biz'){biz=v;saveCfg()}
else if(f==='pc'){cat[k].code=v.trim();saveCfg()}else if(f==='pn'){cat[k].name=v;saveCfg()}else if(f==='pp'){cat[k].price=Math.max(0,+v||0);saveCfg()}else if(f==='pv'){cat[k].var=e.target.checked;saveCfg()}
else if(f==='dn'){discs[k].name=v;saveCfg()}else if(f==='dt'){discs[k].type=v;saveCfg()}else if(f==='dv'){discs[k].value=Math.max(0,+v||0);saveCfg()}else if(f==='dp'){discs[k].pin=e.target.checked;saveCfg()}});
document.addEventListener('input',e=>{const f=e.target.dataset.f,card=e.target.closest('.card');if(f==='q'){q=e.target.value;$('#tl').innerHTML=tiles();return}if(!card)return;const i=+card.dataset.i,c=clients[i];
if(f==='name')c.name=e.target.value;else if(f==='rec'){c.rec=e.target.value;const s=$('#chg'+i);if(s)s.textContent=chg(c)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pi')pinOk()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const go=()=>{if(!document.hidden){flush();pull()}};addEventListener('online',go);document.addEventListener('visibilitychange',go);setInterval(go,20000);
setSt();render();flush();pull();
</script></body></html>
